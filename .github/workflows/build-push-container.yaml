name: Publish Docker image

on:
  release:
    types: [published]

permissions:
  contents: read
  security-events: write # upload the Trivy SARIF to code scanning

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    # "published" also fires for pre-releases; those are handled by the beta
    # workflow and must not overwrite the "latest" tag.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    # Shared with rebuild-weekly.yaml so a release and the weekly rebuild never
    # push "latest" at the same time.
    concurrency:
      group: docker-push-stable
      cancel-in-progress: false
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_DZD_USERNAME }}
          password: ${{ secrets.DOCKERHUB_DZD_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: dzdde/${{ github.event.repository.name }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Docker Hub Description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_DZD_USERNAME }}
          password: ${{ secrets.DOCKERHUB_DZD_PASSWORD }}
          repository: dzdde/${{ github.event.repository.name }}
          short-description: "A container image to host a REDCap instance with a focus in automated deployments."
          enable-url-completion: true
          #readme-filepath: "MedLog/backend/README.md"

      # Report only for now (exit-code 0): findings show up under
      # Security > Code scanning (filed under the release tag). Runs last, so
      # a scan problem can't keep the Docker Hub description from updating.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dzdde/${{ github.event.repository.name }}:${{ steps.meta.outputs.version }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy results to GitHub code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image
