; PHP security hardening
; Do not reveal the PHP version in response headers (X-Powered-By)
expose_php = Off
; Never display errors to end users — log them instead
display_errors = Off
log_errors = On
; Never include call arguments in exception stack traces. Without this, an
; uncaught exception (e.g. a failed community-portal download) prints every
; function argument in cleartext to the logs — including the community username
; and password. This is PHP's own production-recommended default.
zend.exception_ignore_args = On
