; redcap-docker request guard: runs before REDCap on every web request.
; Virtual patch for CVE-2026-90817 (survey passthrough RCE) + defence in depth.
; See /opt/redcap-docker/assets/php/request_guard.php. Disable with REDCAP_REQUEST_GUARD=false.
; NOTE: if you set your own auto_prepend_file in a custom ini, it replaces this one — include
; request_guard.php from your own prepend file to keep the protection.
auto_prepend_file = /opt/redcap-docker/assets/php/request_guard.php
