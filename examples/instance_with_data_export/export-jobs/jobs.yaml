# Export jobs, see ../../DATA_EXPORT.md for all properties.
# Replace the project_id / report_id values with the IDs of your projects.
REDCapExportJobList:
  # Nightly CSV of all records
  - name: project-1-nightly
    project_id: 1
    schedule: "0 2 * * *"

  # Hourly JSON with labels, only some fields, keep one day
  - name: project-1-hourly-labels
    project_id: 1
    schedule: "0 * * * *"
    format: json
    keep: 24
    options:
      rawOrLabel: label
      fields: [record_id]

  # Weekly full project XML (metadata and data) as a restorable backup
  - name: project-1-weekly-xml
    project_id: 1
    schedule: "0 3 * * 0"
    content: project_xml
    keep: 8
    options:
      exportSurveyFields: true
      exportDataAccessGroups: true

  # A saved report, uncomment and set the report_id
  # - name: project-1-report
  #   project_id: 1
  #   schedule: "30 6 * * 1-5"
  #   content: report
  #   report_id: 1
